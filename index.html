<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doctor Appointment System</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Accessible live region for status announcements -->
  <div id="statusAnnouncer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

  <div class="container">
    <h1>🏥 Doctor Appointment System</h1>

    <!-- Reset demo -->
    <div class="demo-controls">
      <button id="resetDemoBtn" class="btn-danger">Reset Demo Data</button>
    </div>

    <!-- ── Add / Edit Doctor ──────────────────────────────────────────────── -->
    <div class="section" id="doctorSection">
      <h2 id="doctorSectionTitle">Add New Doctor</h2>

      <div id="doctorFormError" class="form-error" role="alert" aria-live="assertive" hidden></div>

      <div class="form-group">
        <div class="form-item">
          <label for="doctorName">Doctor Name:</label>
          <input type="text" id="doctorName" placeholder="Enter doctor name" />
        </div>
        <div class="form-item">
          <label for="specialization">Specialization:</label>
          <select id="specialization">
            <option value="">Select Specialization</option>
            <option value="Cardiology">Cardiology</option>
            <option value="Dermatology">Dermatology</option>
            <option value="Neurology">Neurology</option>
            <option value="Orthopedics">Orthopedics</option>
            <option value="Pediatrics">Pediatrics</option>
            <option value="Psychiatry">Psychiatry</option>
            <option value="General Practice">General Practice</option>
            <option value="ENT">ENT</option>
          </select>
        </div>
        <div class="form-item">
          <label for="experience">Experience (Years):</label>
          <input type="number" id="experience" placeholder="Enter experience" min="0" />
        </div>
        <div class="form-item">
          <label for="availability">Availability:</label>
          <select id="availability">
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>
      </div>

      <div class="button-group">
        <button id="addDoctorBtn">Add Doctor</button>
        <button id="cancelEditBtn" class="btn-secondary" hidden>Cancel</button>
        <button id="clearFormBtn" class="btn-secondary">Clear</button>
      </div>
    </div>

    <!-- ── Doctors List ───────────────────────────────────────────────────── -->
    <div class="section">
      <h2>Available Doctors</h2>
      <div id="doctorsList" class="doctors-grid">
        <div class="empty-state">No doctors added yet. Add a doctor to get started!</div>
      </div>
    </div>

    <!-- ── Book Appointment ───────────────────────────────────────────────── -->
    <div class="section">
      <h2>Book Appointment</h2>

      <div id="apptFormError" class="form-error" role="alert" aria-live="assertive" hidden></div>

      <div class="form-group">
        <div class="form-item">
          <label for="apptDoctor">Doctor:</label>
          <select id="apptDoctor">
            <option value="">Select Doctor</option>
          </select>
        </div>
        <div class="form-item">
          <label for="apptSlot">Time Slot:</label>
          <select id="apptSlot">
            <option value="">Select Slot</option>
          </select>
        </div>
        <div class="form-item">
          <label for="apptDate">Date:</label>
          <input type="date" id="apptDate" />
        </div>
      </div>

      <div class="button-group">
        <button id="bookApptBtn">Book Appointment</button>
      </div>
    </div>

    <!-- ── Appointments List ─────────────────────────────────────────────── -->
    <div class="section">
      <h2>Appointments</h2>
      <div id="appointmentsList">
        <div class="empty-state">No appointments booked yet.</div>
      </div>
    </div>
  </div>

  <!-- ── Confirm / Delete modal (replaces browser confirm()) ───────────────── -->
  <div id="confirmModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
    <div id="modalBackdrop" class="modal-backdrop"></div>
    <div class="modal-content">
      <h3 id="modalTitle">Confirm Action</h3>
      <p id="modalMessage"></p>
      <div class="modal-actions">
        <button id="modalConfirmBtn" class="delete">Confirm</button>
        <button id="modalCancelBtn" class="btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
